name: Monetary checks

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  monetary-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run type-check
      - run: npm run lint
      - run: npm test -- --watchAll=false --runInBand
